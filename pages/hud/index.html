<!doctype html>
<html lang="zh-CN" data-theme="cyan">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>插件状态 HUD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="brand">
      <span class="mark"></span>
      <span class="btxt">PLUGIN STATUS HUD</span>
      <span class="bn" id="m-count">0</span>
    </div>
    <div class="tools">
      <button id="theme" class="tool" title="切换主题"><i class="fa-solid fa-palette"></i><span id="theme-tag">CYAN</span></button>
      <button id="refresh" class="tool" title="重新分配图标"><i class="fa-solid fa-arrows-rotate"></i></button>
    </div>
  </header>

  <main id="stage" class="stage">
    <svg id="links" class="links" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
    <div id="core" class="core">
      <span class="core-prog"></span>
      <i class="core-ico fa-solid fa-brain"></i>
      <span class="core-name">推理思考</span>
      <span class="core-num">0</span>
    </div>
    <div id="nodes" class="nodes"></div>
  </main>

  <footer class="foot">
    <span class="ftag">LOG</span>
    <span id="foot">// awaiting uplink…</span>
  </footer>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-icon" id="m-icon"></div>
    <div class="modal-name" id="m-name"></div>
    <dl class="modal-meta">
      <dt>版本</dt><dd id="m-version"></dd>
      <dt>功能</dt><dd id="m-desc"></dd>
      <dt>最近</dt><dd id="m-time"></dd>
    </dl>
    <div class="modal-tip">点上面图标可换 FontAwesome 图标名</div>
    <button id="m-close" class="tool wide">关闭</button>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
